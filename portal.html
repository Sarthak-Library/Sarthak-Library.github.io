'<h3>Your details</h3><small>Only you and the library can see this. Please do not enter Aadhaar or bank details.</small><label>Father\'s name<input id="sf" maxlength="80"></label><label>Alternate mobile (10 digits)<input id="sal" inputmode="numeric" maxlength="10"></label><label>Address<textarea id="sad" rows="3" maxlength="300"></textarea></label><label>PIN code<input id="spn" inputmode="numeric" maxlength="6"></label><button class="p" onclick="sSave()">Save details</button> <button onclick="location.reload()">Logout</button> <small id="sy"></small></div>';

function sSave(){rpc("student_save",{p_member:SM,p_pass:SP,p_father:$("sf").value,p_address:$("sad").value,p_alt:$("sal").value,p_pin:$("spn").value}).then(function(ok){$("sy").className=ok===true?"":"due";$("sy").textContent=ok===true?"Saved ✓":"Could not save. Check mobile (10 digits) and PIN (6 digits)."}).catch(function(){$("sy").textContent="Network error."})}
function inv(id){var r=rows.find(function(x){return x.id==id});if(!r.member_id){alert("This student has no Member ID yet.");return}if(!confirm("Create a new one-time login code for "+r.name+"? This also resets any old student password."))return;rpc("admin_make_invite",{p_id:id},tok).then(function(c){if(typeof c!="string"){alert("Could not create code.");return}showMsg(r,c)})}
if(location.hash=="#admin")tab("a");if(tok)load();setInterval(function(){if(tok)load()},60000);
</script></body></html>
