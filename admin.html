<style>

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--bg);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}

td[data-l="Period"]{white-space:nowrap}.em{text-align:center;padding:48px 20px;color:var(--mut)}
.b{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
dialog{max-width:480px;width:94%;border:0;border-radius:var(--r);background:var(--card);color:var(--ink);padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(8,12,20,.6)}

 .mn{padding:16px 14px 50px}.tp h1{font-size:20px}.tp input{width:100%;order:3}
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr{padding:14px;border-bottom:1px solid var(--line)}tr:last-child{border-bottom:0}
 td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:14px;text-align:right}

 td.mb{display:block;text-align:left;font-size:15px;padding-bottom:8px}td.mb:before{display:none}

 .ac button{flex:1 1 auto}
}

</style></head><body>
<div id="L" class="login"><div class="lc"><div class="lg"><i></i></div><h2>Sarthak Library</h2><p>Admin sign in</p><input id="e" type="email" autocomplete="username" placeholder="Email"><input id="w" type="password" autocomplete="current-password" placeholder="Password"><button class="p" onclick="login()">Sign in</button><small id="m"></small></div></div>

<script>
var FORM_URL="https://forms.gle/Den5ttpCaKE7umdX6";
var JOIN_FEE=0;       /* one-time joining fee / deposit added when you Confirm a student, e.g. 100 */
var CHANNEL_URL="";   /* paste your WhatsApp Channel link here (optional) */
var SB="https://bypixbchtdyimshlnbkn.supabase.co",SK="sb_publishable_jURYK2fzBX1ZJnt5n8bLXw_f1TkxO8h",tok=sessionStorage.t,rows=[],f="pending",$=function(i){return document.getElementById(i)},D=$("D");
var P={"1":"Shift 1 (8-2)","2":"Shift 2 (2-8)","full":"Full day"},PR={"1":400,"2":400,"full":700},DS={1:1,3:.9,6:.85};
var F=[["name","Student name"],["mobile","Mobile (10 digits)"],["seat","Seat (1-50, blank = none)"],["start_date","Start date","date"],["total","Total fee ₹","number"],["extra","Deposit / joining fee ₹ (optional)","number"],["notes","Notes (optional)"]];
function api(p,o){o=o||{};o.headers={apikey:SK,Authorization:"Bearer "+(tok||SK),"Content-Type":"application/json",Prefer:"return=minimal"};return fetch(SB+p,o)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function sid(x){return String(x==null?"":x).replace(/[^\w-]/g,"")}
function dg(x){return String(x==null?"":x).replace(/\D/g,"")}
function login(){fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SK,"Content-Type":"application/json"},body:JSON.stringify({email:$("e").value,password:$("w").value})}).then(function(r){return r.json()}).then(function(d){if(d.access_token){tok=sessionStorage.t=d.access_token;load()}else $("m").textContent="Error: "+(d.msg||d.error_description||d.message||JSON.stringify(d))}).catch(function(e){$("m").textContent="Network error: "+e.message})}
$("w").addEventListener("keydown",function(e){if(e.key=="Enter")login()});
function out(){sessionStorage.clear();location.reload()}
function load(){api("/rest/v1/bookings?select=*,payments(*)&order=created_at.desc").then(function(r){if(r.status==401){out();return}return r.json()}).then(function(d){if(!d)return;$("L").hidden=true;$("A").hidden=false;if(!Array.isArray(d)){$("o").innerHTML='<p class="due"><b>Database error:</b> '+esc(d.message||JSON.stringify(d))+"</p>";return}rows=d;draw()})}
function td(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function paid(r){return(r.payments||[]).reduce(function(a,p){return a+(Number(p.amount)||0)},0)}
function due(r){return(Number(r.total)||0)+(Number(r.extra)||0)-paid(r)}
function endD(r){if(!r.start_date)return"-";var d=new Date(r.start_date+"T00:00:00Z"),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+r.months);d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));return d.toISOString().slice(0,10)}
function dl(r){return r.start_date?Math.ceil((new Date(endD(r))-new Date(td()))/864e5):999}
function exp(r){if(r.status!="approved"||!r.start_date)return"";var d=dl(r);return d<0?' <b class="due">EXPIRED</b>':d<=7?' <b class="due">(expires in '+d+' days)</b>':""}
function match(r){var q=$("q").value.toLowerCase();return!q||[r.member_id,r.name,r.mobile,r.seat,r.exam].join(" ").toLowerCase().indexOf(q)>-1}
function vis(r,k){return k=="all"||(k=="due"?r.status=="approved"&&due(r)>0:k=="exp"?r.status=="approved"&&dl(r)<=7:r.status==k)}
function draw(){backupNote();var ap=rows.filter(function(r){return r.status=="approved"}),col=0,dd=0,np=rows.filter(function(r){return r.status=="pending"}).length;ap.forEach(function(r){col+=paid(r);dd+=Math.max(0,due(r))});
function m(n){return"₹"+Number(n).toLocaleString("en-IN")}
$("st").innerHTML='<div class="sc"><small>Active students</small><b>'+ap.length+'</b></div><div class="sc g"><small>Fees collected</small><b>'+m(col)+'</b></div><div class="sc r"><small>Fees due</small><b>'+m(dd)+'</b></div><div class="sc i"><small>New requests</small><b>'+np+'</b></div>';
var T=[["pending","New requests"],["waiting","Waiting list"],["approved","Students"],["due","Fees due"],["exp","Expiring"],["all","All records"]];
$("tabs").innerHTML=T.map(function(t){return'<button class="nv'+(t[0]==f?" on":"")+'" onclick="f=\''+t[0]+'\';draw()"><span>'+t[1]+'</span><i>'+rows.filter(function(r){return vis(r,t[0])}).length+'</i></button>'}).join("");
T.forEach(function(t){if(t[0]==f)$("pt").textContent=t[1]});
var L=rows.filter(function(r){return vis(r,f)&&match(r)});
if(!L.length){$("o").innerHTML='<div class="em"><b>Nothing here</b><br>No records match this view.</div>';return}
$("o").innerHTML='<table><thead><tr><th>Student</th><th>Plan &amp; seat</th><th>Period</th><th>Fees</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+L.map(function(r){var d=due(r),i="'"+sid(r.id)+"'",ok=r.status=="approved",ex=ok&&r.start_date?dl(r):999;
var pl=(r.payments||[]).slice().sort(function(a,b){return a.paid_on<b.paid_on?-1:1}).map(function(p){return"₹"+esc(p.amount)+" ("+esc(p.paid_on)+') <a href="#" onclick="dp(\''+sid(p.id)+'\');return false" title="Remove payment">✕</a>'}).join(" · ");
var bs=!ok?(r.status=="waiting"?'<span class="bd in">Waiting</span>':'<span class="bd wn">New request</span>'):ex<0?'<span class="bd no">Expired</span>':ex<=7?'<span class="bd wn">Expires in '+ex+'d</span>':'<span class="bd ok">Active</span>';
return'<tr><td class="mb"><b>'+(r.member_id?esc(r.member_id)+" · ":"")+esc(r.name)+'</b><span class="sub"><a href="tel:'+esc(dg(r.mobile))+'">'+esc(r.mobile)+"</a>"+(r.exam?" · "+esc(r.exam):"")+"</span>"+(r.notes?'<span class="sub">'+esc(r.notes)+"</span>":"")+'</td>'+
'<td data-l="Plan"><span>'+esc(P[r.plan_key]||r.plan_key)+'<span class="sub">'+esc(r.months)+" mo · Seat "+esc(r.seat||"-")+'</span></span></td>'+
'<td data-l="Period"><span>'+esc(r.start_date||"-")+'<span class="sub">to '+esc(endD(r))+"</span></span></td>"+
'<td data-l="Fees"><span><b>'+m(r.total||0)+"</b>"+(r.extra?' <small>+ '+m(r.extra)+" deposit</small>":"")+'<span class="sub">Paid '+m(paid(r))+' · <b class="'+(d>0?"due":"")+'">Due '+m(d)+"</b></span>"+(pl?'<span class="sub">'+pl+"</span>":"")+"</span></td>"+
'<td data-l="Status">'+bs+"</td>"+
'<td class="at"><div class="ac">'+(ok?"":'<button class="p" onclick="conf('+i+')">Confirm</button>'+(r.status=="waiting"?"":'<button onclick="up('+i+",{status:\'waiting\'})\">Waitlist</button>"))+(ok?'<button class="p" onclick="pay('+i+')">+ Payment</button><button onclick="renew('+i+')">Renew</button><button onclick="inv('+i+')">Login code</button>':"")+'<button onclick="wa('+i+')">WhatsApp</button><button onclick="openForm('+i+')">Edit</button><button class="x" onclick="del('+i+')">Delete</button></div></td></tr>'}).join("")+"</tbody></table>"}
function chk(r){if(!r.ok)r.text().then(alert);load()}
function up(id,b){var r=rows.find(function(x){return x.id==id});if(b.status=="approved"&&r.seat&&rows.some(function(x){return x.id!=id&&x.status=="approved"&&x.seat==r.seat&&(x.plan_key=="full"||r.plan_key=="full"||x.plan_key==r.plan_key)})&&!confirm("Seat "+r.seat+" is already taken in this shift. Confirm anyway?"))return;return api("/rest/v1/bookings?id=eq."+id,{method:"PATCH",body:JSON.stringify(b)}).then(chk)}
function conf(id){var r=rows.find(function(x){return x.id==id});up(id,{status:"approved",extra:r.extra||JOIN_FEE})}
function pay(id){var a=prompt("Amount received (₹)");if(!a||!+a)return;api("/rest/v1/payments",{method:"POST",body:JSON.stringify({booking_id:id,amount:Math.round(+a),paid_on:td()})}).then(chk)}
function dp(id){if(confirm("Remove this payment entry?"))api("/rest/v1/payments?id=eq."+id,{method:"DELETE"}).then(chk)}
function del(id){if(confirm("Delete this student and their payments permanently?"))api("/rest/v1/bookings?id=eq."+id,{method:"DELETE"}).then(chk)}
function renew(id){var r=rows.find(function(x){return x.id==id}),m=prompt("Renew for how many months? (1, 3 or 6)","1");if(!DS[m])return;var e=endD(r),st=(e!="-"&&e>td())?e:td(),pr=Math.round(PR[r.plan_key]*m*DS[m]);if(!confirm("Renew "+m+" month(s) from "+st+"?\nNew fee ₹"+pr+" (added to any existing due)"))return;up(id,{months:+m,start_date:st,total:(r.total||0)+pr})}
function inv(id){var s=rows.find(function(x){return x.id==id});if(!s||!s.member_id)return;
if(!confirm("Create a new student-login code for "+s.name+"?\nThis also resets their password if they had one."))return;
fetch(SB+"/rest/v1/rpc/admin_make_invite",{method:"POST",headers:{apikey:SK,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})}).then(function(x){return x.json()}).then(function(c){
if(typeof c!=="string"||!/^[0-9]{8}$/.test(c)){alert("Could not create the code. Please log in again and retry.");return}
var t="Hello "+s.name+", activate your Sarthak Library student login.\nMember ID: "+s.member_id+"\nActivation code: "+c+"\nOpen: https://sarthak-library.github.io/#student\nChoose 'First time here?' and set your own password.";
window.open("https://wa.me/91"+dg(s.mobile)+"?text="+encodeURIComponent(t),"_blank")}).catch(function(){alert("Network problem. Please try again.")})}
function wa(id){var r=rows.find(function(x){return x.id==id}),t="Hello "+r.name+", this is Sarthak Library. ";
if(r.status=="approved"){if(dl(r)<=7)t+="Your membership ("+(r.member_id||"")+") "+(dl(r)<0?"expired on ":"expires on ")+endD(r)+". Please renew to keep your seat."+(due(r)>0?" Pending fee: ₹"+due(r)+".":"");
else t+="Your seat is CONFIRMED.\nMember ID: "+r.member_id+"\nPlan: "+P[r.plan_key]+", "+r.months+" month(s)\nSeat: "+(r.seat||"to be assigned")+"\nStarts: "+(r.start_date||"-")+"\nFee ₹"+r.total+" | Paid ₹"+paid(r)+" | Due ₹"+due(r)+(FORM_URL?"\nPlease fill in your registration form: "+FORM_URL:"")+(CHANNEL_URL?"\nFor library notices, join our WhatsApp channel: "+CHANNEL_URL:"")}
else if(r.status=="waiting")t+="You are on our waiting list. We will message you as soon as a seat is free.";
else t+="We received your seat request. We will confirm it shortly.";
window.open("https://wa.me/91"+dg(r.mobile)+"?text="+encodeURIComponent(t),"_blank")}
function openForm(id){var r=id?rows.find(function(x){return x.id==id}):{status:"approved",plan_key:"1",months:1};D.dataset.id=id||"";$("dt").textContent=id?"Edit student":"Add student";$("de").textContent="";
function sel(k,o,l){return"<label>"+l+'<select id="f_'+k+'">'+o.map(function(x){return'<option value="'+x[0]+'">'+x[1]+"</option>"}).join("")+"</select></label>"}
$("df").innerHTML=F.map(function(x){return'<label>'+x[1]+'<input id="f_'+x[0]+'" type="'+(x[2]||"text")+'"></label>'}).join("")+sel("plan_key",[["1","Shift 1"],["2","Shift 2"],["full","Full day"]],"Plan")+sel("months",[[1,"1 month"],[3,"3 months"],[6,"6 months"]],"Duration")+sel("status",[["pending","New request"],["waiting","Waiting list"],["approved","Confirmed student"]],"Status");
F.concat([["plan_key"],["months"],["status"]]).forEach(function(x){$("f_"+x[0]).value=r[x[0]]==null?"":r[x[0]]});
if(!id)$("f_total").value=calc();["f_plan_key","f_months"].forEach(function(k){$(k).onchange=function(){$("f_total").value=calc()}});D.showModal()}
function calc(){return Math.round(PR[$("f_plan_key").value]*$("f_months").value*DS[$("f_months").value])}
