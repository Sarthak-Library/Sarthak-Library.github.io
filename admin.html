<script>

var SB="https://bypixbchtdyimshlnbkn.supabase.co",SK="sb_publishable_jURYK2fzBX1ZJnt5n8bLXw_f1TkxO8h",tok=sessionStorage.t,rows=[],f="pending",$=function(i){return document.getElementById(i)},D=$("D");

function api(p,o){o=o||{};o.headers={apikey:SK,Authorization:"Bearer "+(tok||SK),"Content-Type":"application/json",Prefer:"return=minimal"};return fetch(SB+p,o)}

function endD(r){if(!r.start_date)return"-";var d=new Date(r.start_date+"T00:00:00Z"),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+r.months);d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));return d.toISOString().slice(0,10)}
function dl(r){return r.start_date?Math.ceil((new Date(endD(r))-new Date(td()))/864e5):999}

function vis(r,k){return k=="all"||(k=="due"?r.status=="approved"&&due(r)>0:k=="exp"?r.status=="approved"&&dl(r)<=7:k=="upd"?!!(r.details_updated_at||r.aadhaar_path):r.status==k)}
/* student-submitted details + Aadhaar: helpers */
function upd(r){return r.details_updated_at||r.aadhaar_uploaded_at||""}
function seenT(){try{return+localStorage.lbSeen||0}catch(e){return 0}}
function nw(r){var u=Date.parse(upd(r));return!!u&&u>seenT()}
function seenAll(){var m=seenT();rows.forEach(function(r){var u=Date.parse(upd(r));if(u>m)m=u});try{localStorage.lbSeen=m}catch(e){}draw()}
function fdt(s){try{return new Date(s).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})}catch(e){return String(s||"")}}
var AP=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\/aadhaar\.pdf$/;
function draw(){backupNote();var ap=rows.filter(function(r){return r.status=="approved"}),col=0,dd=0,np=rows.filter(function(r){return r.status=="pending"}).length;ap.forEach(function(r){col+=paid(r);dd+=Math.max(0,due(r))});

$("st").innerHTML='<div class="sc"><small>Active students</small><b>'+ap.length+'</b></div><div class="sc g"><small>Fees collected</small><b>'+m(col)+'</b></div><div class="sc r"><small>Fees due</small><b>'+m(dd)+'</b></div><div class="sc i"><small>New requests</small><b>'+np+'</b></div>';

T.forEach(function(t){if(t[0]==f)$("pt").textContent=t[1]});

if(!L.length){$("o").innerHTML='<div class="em"><b>Nothing here</b><br>No records match this view.</div>';return}
$("o").innerHTML='<table><thead><tr><th>Student</th><th>Plan &amp; seat</th><th>Period</th><th>Fees</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+L.map(function(r){var d=due(r),i="'"+sid(r.id)+"'",ok=r.status=="approved",ex=ok&&r.start_date?dl(r):999;
var pl=(r.payments||[]).slice().sort(function(a,b){return a.paid_on<b.paid_on?-1:1}).map(function(p){return"₹"+esc(p.amount)+" ("+esc(p.paid_on)+') <a href="#" onclick="dp(\''+sid(p.id)+'\');return false" title="Remove payment">✕</a>'}).join(" · ");
var bs=!ok?(r.status=="waiting"?'<span class="bd in">Waiting</span>':'<span class="bd wn">New request</span>'):ex<0?'<span class="bd no">Expired</span>':ex<=7?'<span class="bd wn">Expires in '+ex+'d</span>':'<span class="bd ok">Active</span>';
return'<tr><td class="mb"><b>'+(r.member_id?esc(r.member_id)+" · ":"")+esc(r.name)+'</b><span class="sub"><a href="tel:'+esc(dg(r.mobile))+'">'+esc(r.mobile)+"</a>"+(r.exam?" · "+esc(r.exam):"")+"</span>"+(r.notes?'<span class="sub">'+esc(r.notes)+"</span>":"")+
((r.father_name||r.address||r.alt_mobile||r.pin)?'<span class="sub">Father: '+esc(r.father_name||"-")+" · Alt mobile: "+esc(r.alt_mobile||"-")+'</span><span class="sub">Address: '+esc(r.address||"-")+(r.pin?" – "+esc(r.pin):"")+"</span>":"")+
(upd(r)?'<span class="sub">Student updated: '+esc(fdt(upd(r)))+(nw(r)?' <b class="bd in">NEW</b>':"")+"</span>":"")+
(ok?'<span class="sub">Aadhaar PDF: '+(r.aadhaar_path?"uploaded "+esc(fdt(r.aadhaar_uploaded_at)):"not uploaded yet")+"</span>":"")+'</td>'+
'<td data-l="Plan"><span>'+esc(P[r.plan_key]||r.plan_key)+'<span class="sub">'+esc(r.months)+" mo · Seat "+esc(r.seat||"-")+'</span></span></td>'+

/* ===== Seat chart: every seat 1-50 with the student sitting in it ===== */
var SEATS=50;
function seatOf(k,sh){/* active students on seat k for shift sh ("1","2") - full-day students cover both shifts */
 return rows.filter(function(r){return r.status=="approved"&&+r.seat==k&&(r.plan_key=="full"||r.plan_key==sh)})}

function seatChart(){
 var q=$("q").value.toLowerCase(),free1=0,free2=0,h="";
 for(var k=1;k<=SEATS;k++){
  var a=seatOf(k,"1"),b=seatOf(k,"2");if(!a.length)free1++;if(!b.length)free2++;

   (all.length?'':'<button class="p" onclick="pick('+k+')">Allot student</button>')+
   (all.length&&(!a.length||!b.length)?'<button onclick="pick('+k+')">Allot to free shift</button>':'')+
   all.map(function(r){return'<button class="x" onclick="unseat(\''+sid(r.id)+'\')">Free '+esc(r.name.split(" ")[0])+'</button>'}).join("")+'</div></td></tr>'}
 var w=rows.filter(function(r){return r.status=="approved"&&!r.seat});
 return'<div class="c" style="background:var(--infobg);color:var(--info);border-color:var(--info);border-radius:0;margin:0;border-width:0 0 1px">Shift 1: <b>'+free1+'</b> seats free · Shift 2: <b>'+free2+'</b> seats free'+(w.length?' · <b>'+w.length+'</b> confirmed student'+(w.length>1?'s':'')+' without a seat: '+w.map(function(r){return esc(r.name)}).join(", "):'')+'</div>'+
 (h?'<table><thead><tr><th>Seat</th><th>Shift 1 (8 AM – 2 PM)</th><th>Shift 2 (2 PM – 8 PM)</th><th>Actions</th></tr></thead><tbody>'+h+'</tbody></table>':'<div class="em"><b>No seat matches</b></div>')}
/* allot from a student row: ask for a seat number */
function allot(id){var r=rows.find(function(x){return x.id==id});if(!r)return;var s=prompt("Seat number for "+r.name+" (1-"+SEATS+")",r.seat||"");if(s===null)return;s=+s;if(!s||s<1||s>SEATS||s%1){alert("Enter a seat number from 1 to "+SEATS+".");return}up(id,{seat:s,status:"approved"})}
/* allot from a seat row: choose from confirmed students who have no seat (or pending/waiting ones) */
function pick(k){
 var c=rows.filter(function(r){return(r.status!="approved"||!r.seat)}).sort(function(a,b){return(a.status=="approved"?0:1)-(b.status=="approved"?0:1)});
 if(!c.length){alert("Every student already has a seat. Add or confirm a student first.");return}
 var m="Allot seat "+k+" to which student? Type the number:\n\n"+c.map(function(r,i){return(i+1)+". "+r.name+" ("+(P[r.plan_key]||r.plan_key)+(r.status=="approved"?"":", "+r.status)+")"}).join("\n");
 var n=prompt(m);if(n===null)return;var r=c[(+n)-1];if(!r){alert("Please type a number from the list.");return}
 up(r.id,{seat:k,status:"approved"})}
function unseat(id){var r=rows.find(function(x){return x.id==id});if(r&&confirm("Remove "+r.name+" from seat "+r.seat+"?"))up(id,{seat:null})}
function chk(r){if(!r.ok)r.text().then(alert);load()}
function up(id,b){var r=rows.find(function(x){return x.id==id});if(b.status=="approved"&&r.seat&&rows.some(function(x){return x.id!=id&&x.status=="approved"&&x.seat==r.seat&&(x.plan_key=="full"||r.plan_key=="full"||x.plan_key==r.plan_key)})&&!confirm("Seat "+r.seat+" is already taken in this shift. Confirm anyway?"))return;return api("/rest/v1/bookings?id=eq."+id,{method:"PATCH",body:JSON.stringify(b)}).then(chk)}
function conf(id){var r=rows.find(function(x){return x.id==id});up(id,{status:"approved",extra:r.extra||JOIN_FEE})}
function pay(id){var a=prompt("Amount received (₹)");if(!a||!+a)return;api("/rest/v1/payments",{method:"POST",body:JSON.stringify({booking_id:id,amount:Math.round(+a),paid_on:td()})}).then(chk)}
function dp(id){if(confirm("Remove this payment entry?"))api("/rest/v1/payments?id=eq."+id,{method:"DELETE"}).then(chk)}
function del(id){var r=rows.find(function(x){return x.id==id});if(!confirm("Delete this student and their payments permanently?"))return;
var go=function(){return api("/rest/v1/bookings?id=eq."+id,{method:"DELETE"}).then(chk)};
if(r&&AP.test(r.aadhaar_path||""))api("/storage/v1/object/aadhaar/"+r.aadhaar_path,{method:"DELETE"}).then(go,go);else go()}
function aad(id){var r=rows.find(function(x){return x.id==id});if(!r||!AP.test(r.aadhaar_path||""))return;var w=window.open("about:blank","_blank");if(w)w.opener=null;
fetch(SB+"/storage/v1/object/sign/aadhaar/"+r.aadhaar_path,{method:"POST",headers:{apikey:SK,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({expiresIn:120})}).then(function(x){return x.json()}).then(function(d){
if(!d||typeof d.signedURL!=="string"||d.signedURL.indexOf("/object/sign/aadhaar/")!==0){if(w)w.close();alert("Could not open the Aadhaar file. Please log in again and retry.");return}
var u=SB+"/storage/v1"+d.signedURL;if(w)w.location.href=u;else location.href=u}).catch(function(){if(w)w.close();alert("Network problem. Please try again.")})}
function raad(id){var r=rows.find(function(x){return x.id==id});if(!r||!AP.test(r.aadhaar_path||""))return;if(!confirm("Permanently delete the Aadhaar PDF of "+r.name+"?"))return;
api("/storage/v1/object/aadhaar/"+r.aadhaar_path,{method:"DELETE"}).then(function(x){if(!x.ok&&x.status!==404){x.text().then(alert);return}
return api("/rest/v1/bookings?id=eq."+id,{method:"PATCH",body:JSON.stringify({aadhaar_path:null,aadhaar_uploaded_at:null})}).then(chk)})}
function renew(id){var r=rows.find(function(x){return x.id==id}),m=prompt("Renew for how many months? (1, 3 or 6)","1");if(!DS[m])return;var e=endD(r),st=(e!="-"&&e>td())?e:td(),pr=Math.round(PR[r.plan_key]*m*DS[m]);if(!confirm("Renew "+m+" month(s) from "+st+"?\nNew fee ₹"+pr+" (added to any existing due)"))return;up(id,{months:+m,start_date:st,total:(r.total||0)+pr})}
function inv(id){var s=rows.find(function(x){return x.id==id});if(!s||!s.member_id)return;
if(!confirm("Create a new student-login code for "+s.name+"?\nThis also resets their password if they had one."))return;
fetch(SB+"/rest/v1/rpc/admin_make_invite",{method:"POST",headers:{apikey:SK,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({p_id:id})}).then(function(x){return x.json()}).then(function(c){
if(typeof c!=="string"||!/^[0-9]{8}$/.test(c)){alert("Could not create the code. Please log in again and retry.");return}
var t="Hello "+s.name+", activate your Sarthak Library student login.\nMember ID: "+s.member_id+"\nActivation code: "+c+"\nOpen: https://sarthak-library.github.io/#student\nChoose 'First time here?' and set your own password.";
window.open("https://wa.me/91"+dg(s.mobile)+"?text="+encodeURIComponent(t),"_blank")}).catch(function(){alert("Network problem. Please try again.")})}
function wa(id){var r=rows.find(function(x){return x.id==id}),t="Hello "+r.name+", this is Sarthak Library. ";
if(r.status=="approved"){if(dl(r)<=7)t+="Your membership ("+(r.member_id||"")+") "+(dl(r)<0?"expired on ":"expires on ")+endD(r)+". Please renew to keep your seat."+(due(r)>0?" Pending fee: ₹"+due(r)+".":"");
else t+="Your seat is CONFIRMED.\nMember ID: "+r.member_id+"\nPlan: "+P[r.plan_key]+", "+r.months+" month(s)\nSeat: "+(r.seat||"to be assigned")+"\nStarts: "+(r.start_date||"-")+"\nFee ₹"+r.total+" | Paid ₹"+paid(r)+" | Due ₹"+due(r)+(FORM_URL?"\nPlease fill in your registration form: "+FORM_URL:"")+(CHANNEL_URL?"\nFor library notices, join our WhatsApp channel: "+CHANNEL_URL:"")}
else if(r.status=="waiting")t+="You are on our waiting list. We will message you as soon as a seat is free.";
else t+="We received your seat request. We will confirm it shortly.";
window.open("https://wa.me/91"+dg(r.mobile)+"?text="+encodeURIComponent(t),"_blank")}
function openForm(id){var r=id?rows.find(function(x){return x.id==id}):{status:"approved",plan_key:"1",months:1};D.dataset.id=id||"";$("dt").textContent=id?"Edit student":"Add student";$("de").textContent="";
function sel(k,o,l){return"<label>"+l+'<select id="f_'+k+'">'+o.map(function(x){return'<option value="'+x[0]+'">'+x[1]+"</option>"}).join("")+"</select></label>"}
$("df").innerHTML=F.map(function(x){return'<label>'+x[1]+'<input id="f_'+x[0]+'" type="'+(x[2]||"text")+'"></label>'}).join("")+sel("plan_key",[["1","Shift 1"],["2","Shift 2"],["full","Full day"]],"Plan")+sel("months",[[1,"1 month"],[3,"3 months"],[6,"6 months"]],"Duration")+sel("status",[["pending","New request"],["waiting","Waiting list"],["approved","Confirmed student"]],"Status");
F.concat([["plan_key"],["months"],["status"]]).forEach(function(x){$("f_"+x[0]).value=r[x[0]]==null?"":r[x[0]]});
if(!id)$("f_total").value=calc();["f_plan_key","f_months"].forEach(function(k){$(k).onchange=function(){$("f_total").value=calc()}});D.showModal()}
function calc(){return Math.round(PR[$("f_plan_key").value]*$("f_months").value*DS[$("f_months").value])}
function saveF(){var b={};F.forEach(function(x){b[x[0]]=$("f_"+x[0]).value.trim()||null});["plan_key","status"].forEach(function(k){b[k]=$("f_"+k).value});b.months=+$("f_months").value;b.seat=b.seat?+b.seat:null;b.total=+b.total||0;b.extra=+b.extra||0;
if(!b.name||!/^\d{10}$/.test(b.mobile||"")){$("de").textContent="Name and a 10-digit mobile are required.";return}if(b.seat&&(b.seat<1||b.seat>50)){$("de").textContent="Seat must be 1-50.";return}
var id=D.dataset.id;D.close();if(id)up(id,b);else api("/rest/v1/bookings",{method:"POST",body:JSON.stringify(b)}).then(chk)}
function cell(v){var s=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s))s="'"+s;return s.replace(/"/g,'""')}
function csv(){var h=["member_id","name","mobile","father_name","alt_mobile","address","pin","aadhaar_uploaded","plan_key","months","seat","start_date","end_date","total","extra","paid","due","status","notes"];var t=[h.join(",")].concat(rows.map(function(r){r=Object.assign({},r,{end_date:endD(r),paid:paid(r),due:due(r),aadhaar_uploaded:r.aadhaar_path?"yes":"no"});return h.map(function(k){return'"'+cell(r[k])+'"'}).join(",")})).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="library-"+td()+".csv";a.click();try{localStorage.lb=td()}catch(e){}}
function backupNote(){var lb;try{lb=localStorage.lb}catch(e){}var d=lb?Math.floor((new Date(td())-new Date(lb))/864e5):999;var nn=rows.filter(nw).length,ub=nn?'<div class="c" style="background:var(--infobg);color:var(--info);border-color:var(--info)">'+nn+(nn==1?" student has":" students have")+' updated their details or Aadhaar. <button onclick="f=\'upd\';draw()">View</button> <button onclick="seenAll()">Mark as seen</button></div>':"";
$("bk").innerHTML=ub+(d>=7?'<div class="c due">'+(lb?"Last backup was "+d+" days ago. ":"You have not taken a backup yet. ")+"Select Backup to download your data.</div>":"")}

setInterval(function(){if(tok&&!document.hidden&&!D.open&&!$("A").hidden)load()},30000);
